name: Docker Build & Push to GHCR

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'app/**'
      - 'server/**'
      - 'public/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'server/**'
      - 'public/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'nuxt.config.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            architecture: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}

      - name: Build image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_VERSION=${{ github.sha }}
          outputs: >-
            ${{ github.event_name != 'pull_request' &&
              format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true',
              env.REGISTRY, steps.image.outputs.name) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.architecture }}

      - name: Export image digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload image digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.architecture }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Normalize image name
        id: image
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download image digests
        uses: actions/download-artifact@v5
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-platform manifest
        working-directory: /tmp/digests
        run: |
          readarray -t tags < <(
            jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON"
          )
          image="${{ env.REGISTRY }}/${{ steps.image.outputs.name }}"
          readarray -t digests < <(
            for digest_file in ./*; do
              printf '%s@sha256:%s\n' "$image" "${digest_file##*/}"
            done
          )
          docker buildx imagetools create "${tags[@]}" "${digests[@]}"
